name: build

# The CI of milestone M0 and slice 1 (DESIGN.md 9.1, .github/devdocs/m0/PLAN.md):
#
#   plan        the legs: default, plus upstream-zig when gated; and the
#               library recipes this run builds (slice2 PLAN.md D129):
#               .github/scripts/plan-recipes.py renders every recipe of
#               pixi.toml's build-libs list and builds the ones whose file
#               is not on universe; a published file with other recipe or
#               test files fails the run (R15, the D96 check at the start).
#               A dispatch can force recipes (`recipes`) or all (`full`);
#               the `full-ci` label builds all
#   toolchain   zig-toolchain for linux-64 into a local channel, per leg
#   cross       the selected library recipes, in build-libs order, for
#               win-64 and win-arm64 on linux (pixi run build; its recipe
#               tests run there too); dependencies not built in the run
#               come from universe
#   test        each built package's tests on windows-latest (win-64) and
#               windows-11-arm (win-arm64): rattler-build test
#               --package-file, which links and runs the smoke executable
#               natively with that subdir's conda-forge zig
#   alignment   one build number per package across subdirs
#   publish     the default leg's packages to prefix.dev universe (M5,
#               PLAN.md D30), only on main with CONDA_PUBLISH set
#
# cross, test, r-consumer and alignment run only when plan selected at
# least one recipe; publish then still uploads a new zig-toolchain.
#
# Each leg runs once per pixi environment: `default` (conda-forge zig, what
# would be published) always; `upstream-zig` (PyPI ziglang through ZIG_BIN,
# the reference zig, D11) only as the gated release check: a pull request
# labelled `upstream-zig` or `full-ci`, or a dispatch with upstream_zig.
# Its packages carry the same file names, so they live in their own output
# dir and artifacts (channel-<subdir>-upstream-zig) and are never published.
# pixi.toml holds every build command; this file calls `pixi run --locked
# <task>`, so CI never writes pixi.lock. The Windows legs have no locked
# env (DESIGN 3), and publish needs none: they run rattler-build through
# `pixi exec`.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - ".github/devdocs/**"
      - "LICENSE"
  pull_request:
    # labeled: adding `upstream-zig` or `full-ci` starts the gated legs at
    # once; any other label starts nothing (the plan job's condition)
    types: [opened, synchronize, reopened, labeled]
    paths-ignore:
      - "**/*.md"
      - ".github/devdocs/**"
      - "LICENSE"
  workflow_dispatch:
    inputs:
      upstream_zig:
        description: Also build and test with upstream zig (PyPI ziglang via ZIG_BIN)
        type: boolean
        default: false
      recipes:
        description: Also build these recipes (space separated, e.g. zig-libcurl zig-netcdf), published or not
        type: string
        default: ""
      full:
        description: Build every library recipe
        type: boolean
        default: false

# One run per ref; a newer push to a pull request cancels the older run.
# Runs on main are not cancelled. A `labeled` event for another label gets
# a group of its own, so it cannot cancel a running build.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}${{ (github.event.action == 'labeled' && github.event.label.name != 'upstream-zig' && github.event.label.name != 'full-ci') && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  # rattler-build's output dir and local channel per env (pixi.toml reads
  # these; the default env's LIBS_ZIG_OUT, the upstream-zig env's
  # LIBS_ZIG_OUT_UPSTREAM)
  LIBS_ZIG_OUT: ${{ github.workspace }}/out/default
  LIBS_ZIG_OUT_UPSTREAM: ${{ github.workspace }}/out/upstream-zig
  # the rattler-build pixi.lock has (bump both together); the Windows legs
  # run it with pixi exec
  RATTLER_BUILD_VERSION: "0.80.2"

jobs:
  plan:
    name: plan (legs)
    if: >-
      github.event.action != 'labeled' ||
      github.event.label.name == 'upstream-zig' || github.event.label.name == 'full-ci'
    runs-on: ubuntu-latest
    # rendering 35 recipes for 2 subdirs and fetching their published files
    # took 3 minutes on gamma
    timeout-minutes: 20
    outputs:
      envs: ${{ steps.legs.outputs.envs }}
      recipes: ${{ steps.recipes.outputs.recipes }}
      any: ${{ steps.recipes.outputs.any }}
    steps:
      - name: Legs (default; upstream-zig when gated)
        id: legs
        env:
          UPSTREAM: >-
            ${{ (github.event_name == 'workflow_dispatch' && inputs.upstream_zig) ||
            (github.event_name == 'pull_request' &&
            (contains(github.event.pull_request.labels.*.name, 'upstream-zig') ||
            contains(github.event.pull_request.labels.*.name, 'full-ci'))) }}
        run: |
          if [ "$UPSTREAM" = true ]; then
            echo 'envs=["default","upstream-zig"]' >> "$GITHUB_OUTPUT"
          else
            echo 'envs=["default"]' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@v0.11.3
        with:
          pixi-version: v0.84.2
          environments: default
          cache: true
          cache-write: ${{ github.event_name == 'push' && github.ref_name == 'main' }}
      # the runner's python3 (stdlib only), not a pixi env's: a python in
      # the build env could leak into CMake builds (D78, D97)
      - name: Recipes to build (D129)
        id: recipes
        env:
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.recipes || '' }}
          FULL: >-
            ${{ (github.event_name == 'workflow_dispatch' && inputs.full) ||
            (github.event_name == 'pull_request' &&
            contains(github.event.pull_request.labels.*.name, 'full-ci')) }}
        run: |
          args=(--force "$FORCE")
          [ "$FULL" = true ] && args+=(--full)
          python3 -I .github/scripts/plan-recipes.py "${args[@]}"

  # One leg per env, so a failed upstream-zig build never hides the default
  # results and the other way round (D34 amendment, PLAN.md). The later
  # jobs gate on plan only; a leg whose toolchain failed fails at its own
  # artifact download.
  toolchain:
    name: toolchain linux-64 (${{ matrix.env }})
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        env: ${{ fromJSON(needs.plan.outputs.envs) }}
    env:
      PIXI_ENV: ${{ matrix.env }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@v0.11.3
        with:
          # the pixi that wrote pixi.lock (bump both together)
          pixi-version: v0.84.2
          environments: ${{ matrix.env }}
          cache: true
          cache-write: ${{ github.event_name == 'push' && github.ref_name == 'main' }}
      - name: Build zig-toolchain
        run: pixi run --locked -e "$PIXI_ENV" build-toolchain 2>&1 | tee build.log
      - uses: ./.github/actions/which-zig
        with:
          log: build.log
          env: ${{ matrix.env }}
      - name: Drop work trees before upload
        if: always()
        run: rm -rf "out/$PIXI_ENV/bld" "out/$PIXI_ENV/src_cache" "out/$PIXI_ENV/test"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: channel-linux-64-${{ matrix.env }}
          path: |
            out/${{ matrix.env }}/linux-64
            out/${{ matrix.env }}/noarch
          if-no-files-found: error
          retention-days: 14

  cross:
    name: cross ${{ matrix.subdir }} (${{ matrix.env }})
    needs: [plan, toolchain]
    # a matrix job's result is the worst of its legs, so gate on plan, not
    # toolchain: a failed toolchain leg fails only its own env's legs (at
    # the artifact download)
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.any == 'true' }}
    runs-on: ubuntu-latest
    # all nine recipes for one subdir took 1150 s on a 16-core host (19 min;
    # GDAL alone 365 s); ubuntu-latest has 4 cores, so about 4x that, with
    # headroom; with slice 2 (36 recipes) win-64 took 87 minutes before the
    # data stack (run 45501637501)
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        subdir: [win-64, win-arm64]
        env: ${{ fromJSON(needs.plan.outputs.envs) }}
    env:
      SUBDIR: ${{ matrix.subdir }}
      PIXI_ENV: ${{ matrix.env }}
      RECIPES: ${{ needs.plan.outputs.recipes }}
      # one zig global cache for every recipe of the job (the target's C
      # runtime and libc++, built once; slice2 D115), passed to the build
      # scripts by each recipe's LIBS_ZIG_CACHE env.get
      LIBS_ZIG_CACHE: ${{ github.workspace }}/zig-cache
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@v0.11.3
        with:
          pixi-version: v0.84.2
          environments: ${{ matrix.env }}
          cache: true
          cache-write: ${{ github.event_name == 'push' && github.ref_name == 'main' }}
      # kept between runs as setup-pixi's cache: written on main only, read
      # everywhere; zig's cache is content addressed, so an older one is
      # only a smaller head start
      - uses: actions/cache/restore@v6.1.0
        with:
          path: zig-cache
          key: zig-cross-${{ matrix.subdir }}-${{ matrix.env }}-${{ hashFiles('variants.yaml') }}-${{ github.sha }}
          restore-keys: |
            zig-cross-${{ matrix.subdir }}-${{ matrix.env }}-${{ hashFiles('variants.yaml') }}-
            zig-cross-${{ matrix.subdir }}-${{ matrix.env }}-
      # the toolchain job's channel (linux-64 zig-toolchain built by the
      # same env's zig), as the start of this job's channel
      - uses: actions/download-artifact@v8.0.2
        with:
          name: channel-linux-64-${{ matrix.env }}
          path: out/${{ matrix.env }}
      # the recipes plan selected, in build-libs order (D129); the build
      # task takes the other zig-* dependencies from universe. rattler-build
      # runs each recipe's tests after its build
      - name: Build the libraries
        run: |
          for r in $RECIPES; do
            echo "::group::$r"
            pixi run --locked -e "$PIXI_ENV" build "$r" "$SUBDIR"
            echo "::endgroup::"
          done 2>&1 | tee build.log
      - uses: ./.github/actions/which-zig
        with:
          log: build.log
          env: ${{ matrix.env }}
      - uses: actions/cache/save@v6.1.0
        if: github.event_name == 'push' && github.ref_name == 'main'
        with:
          path: zig-cache
          key: zig-cross-${{ matrix.subdir }}-${{ matrix.env }}-${{ hashFiles('variants.yaml') }}-${{ github.sha }}
      - name: Drop work trees before upload
        if: always()
        run: rm -rf "out/$PIXI_ENV/bld" "out/$PIXI_ENV/src_cache" "out/$PIXI_ENV/test"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: channel-${{ matrix.subdir }}-${{ matrix.env }}
          path: |
            out/${{ matrix.env }}/${{ matrix.subdir }}
            out/${{ matrix.env }}/noarch
          if-no-files-found: error
          retention-days: 14

  test:
    name: test ${{ matrix.subdir }} (${{ matrix.env }})
    needs: [plan, cross]
    # !cancelled() and plan only: one failed toolchain or cross leg fails
    # only its own test leg (at the artifact download), not all of them
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.any == 'true' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 200
    strategy:
      fail-fast: false
      matrix:
        subdir: [win-64, win-arm64]
        env: ${{ fromJSON(needs.plan.outputs.envs) }}
        include:
          - subdir: win-64
            runner: windows-latest
          - subdir: win-arm64
            runner: windows-11-arm
    env:
      SUBDIR: ${{ matrix.subdir }}
    steps:
      - name: Defender exclusions
        shell: pwsh
        continue-on-error: true
        # flang-pixi's: real-time scanning of every object file slows zig
        # and rattler-build down; runners are admin, harmless if it fails
        run: |
          Add-MpPreference -ExclusionPath "$env:GITHUB_WORKSPACE","$env:RUNNER_TEMP","$env:TEMP","$env:USERPROFILE\.pixi","$env:USERPROFILE\.cache","$env:LOCALAPPDATA\rattler","$env:LOCALAPPDATA\zig"
          Add-MpPreference -ExclusionProcess "zig.exe","pkgconf.exe","rattler-build.exe","pixi.exe"
      # (the tests come inside the packages; the checkout is for setup-pixi)
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@v0.11.3
        with:
          pixi-version: v0.84.2
          run-install: false
      - uses: actions/download-artifact@v8.0.2
        with:
          name: channel-${{ matrix.subdir }}-${{ matrix.env }}
          path: channel
      # zig's per-user global cache, which every package's pkgtest shares
      # (the C runtime and libc++ for the smoke links, pkgtest.zig itself;
      # slice2 D115): the test env keeps LOCALAPPDATA. Written on main only.
      - uses: actions/cache/restore@v6.1.0
        with:
          path: ~/AppData/Local/zig
          key: zig-test-${{ matrix.subdir }}-${{ matrix.env }}-${{ hashFiles('variants.yaml', 'tests/pkgtest.zig') }}-${{ github.sha }}
          restore-keys: |
            zig-test-${{ matrix.subdir }}-${{ matrix.env }}-${{ hashFiles('variants.yaml', 'tests/pkgtest.zig') }}-
            zig-test-${{ matrix.subdir }}-${{ matrix.env }}-
      # Each package's stored tests (recipes/*/recipe.yaml `tests:`): for a
      # library, tests/pkgtest.zig, run with this subdir's conda-forge zig,
      # pkgconf (and llvm-tools for the C++ libraries), which links the
      # smoke sources with `pkgconf --cflags --libs` of the installed
      # package and its zig-* dependencies (from the same channel) and runs
      # them; dependencies this run did not build come from universe.
      # Every package this run built is tested, also after a failure; the
      # step fails if any did. The step timeout
      # catches a hung process spawn (r-zig-pixi's windows-latest MSYS
      # flake).
      # 45 minutes ran out with 15 packages and a cold zig cache (slice2
      # PLAN.md S2-F28); the text stack brings 28 (each test links its
      # smoke program, about 3 minutes cold).
      - name: rattler-build test each package
        timeout-minutes: 180
        run: |
          chan="file:///$(cygpath -m "$PWD")/channel"
          failed=() n=0
          for f in channel/"$SUBDIR"/*.conda; do
            n=$((n + 1))
            echo "::group::rattler-build test $f"
            if pixi exec --spec "rattler-build==$RATTLER_BUILD_VERSION" -- \
              rattler-build test --package-file "$f" -c "$chan" -c https://prefix.dev/universe -c conda-forge; then
              r=ok
            else
              r=FAIL failed+=("$f")
            fi
            echo "::endgroup::"
            echo "- \`$(basename "$f")\`: $r" >> "$GITHUB_STEP_SUMMARY"
          done
          echo "$n package(s) tested, ${#failed[@]} failed: ${failed[*]}"
          [ "$n" -gt 0 ] && [ "${#failed[@]}" -eq 0 ]
      - uses: actions/cache/save@v6.1.0
        if: always() && github.event_name == 'push' && github.ref_name == 'main'
        with:
          path: ~/AppData/Local/zig
          key: zig-test-${{ matrix.subdir }}-${{ matrix.env }}-${{ hashFiles('variants.yaml', 'tests/pkgtest.zig') }}-${{ github.sha }}

  # R packages built from source against this run's packages (DESIGN 9.1
  # item 4; slice2 PLAN.md D102, D113): r-zig-slim and r-zig-toolchain
  # from universe, the zig-* libraries from this run's channel (listed
  # first, so strict channel priority takes them over universe's published
  # builds), the other sysdeps from conda-forge. tests/r/install.R installs
  # the packages and their dependencies from CRAN sources, then
  # tests/r/smoke.R runs one check per library. Default leg only for now
  # (D113); the upstream-zig leg comes later. No lock: a throwaway
  # manifest in RUNNER_TEMP.
  #
  # Required since r-zig build 12 (universe, 2026-11-24; slice2 PLAN.md
  # D116): its Rcmd_environ points R at zig-libs (CONTRACT.md 6), so the
  # build-11 emulation of D114 is gone. r-zig-slim/toolchain pinned *_12.
  r-consumer:
    name: r-consumer ${{ matrix.subdir }}
    needs: [plan, cross]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.any == 'true' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          # sf needs units (zig-udunits2 since slice 2 batch 2), so both
          # arches run the same list. libboost-headers: RPostgres takes
          # boost from the toolchain's tree when it uses a system libpq
          # (S2-F27). pgserver: a conda-forge PostgreSQL server for
          # RPostgres' query checks (none for win-arm64 on conda-forge)
          # libxml2 (igraph, xml2) is zig-libxml2 since D125, no longer
          # conda-forge's libxml2-devel.
          - subdir: win-64
            runner: windows-latest
            sysdeps: cmake libboost-headers
            packages: sf terra gdalraster s2 gmp Rmpfr igraph nloptr units gsl RPostgres png jpeg tiff webp systemfonts textshaping ragg xml2 hdf5r ncdf4 RNetCDF
            pgserver: "16.*"
          - subdir: win-arm64
            runner: windows-11-arm
            sysdeps: cmake libboost-headers
            packages: sf terra gdalraster s2 gmp Rmpfr igraph nloptr units gsl RPostgres png jpeg tiff webp systemfonts textshaping ragg xml2 hdf5r ncdf4 RNetCDF
            pgserver: ""
    env:
      SUBDIR: ${{ matrix.subdir }}
      SYSDEPS: ${{ matrix.sysdeps }}
      PACKAGES: ${{ matrix.packages }}
      # the zig-* libraries the packages link (sf, terra, gdalraster: gdal,
      # geos, proj; terra: onetbb; s2: abseil, openssl; gmp, Rmpfr, igraph:
      # gmp, mpfr, glpk; nloptr: nlopt; units: udunits2, expat; gsl: gsl;
      # RPostgres: libpq, openssl; png, jpeg, tiff, webp, systemfonts,
      # textshaping, ragg: the text stack and its compression libraries,
      # D122; they come with the six named here; igraph, xml2: libxml2,
      # with libiconv, zlib and xz, D125; hdf5r, ncdf4, RNetCDF: hdf5 and
      # netcdf, which bring hdf4, libaec, libcurl, D126, D127)
      ZIG_LIBS: zig-gdal zig-geos zig-proj zig-onetbb zig-abseil zig-openssl zig-gmp zig-mpfr zig-glpk zig-nlopt zig-udunits2 zig-expat zig-gsl zig-libpq zig-libpng zig-libjpeg zig-libtiff zig-libwebp zig-freetype zig-harfbuzz zig-fribidi zig-libxml2 zig-hdf5 zig-netcdf
    steps:
      - name: Defender exclusions
        shell: pwsh
        continue-on-error: true
        run: |
          Add-MpPreference -ExclusionPath "$env:GITHUB_WORKSPACE","$env:RUNNER_TEMP","$env:TEMP","$env:USERPROFILE\.pixi","$env:USERPROFILE\.cache","$env:LOCALAPPDATA\rattler","$env:LOCALAPPDATA\zig"
          Add-MpPreference -ExclusionProcess "zig.exe","pkgconf.exe","pixi.exe","Rscript.exe","Rterm.exe","make.exe","sh.exe"
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@v0.11.3
        with:
          pixi-version: v0.84.2
          run-install: false
      - uses: actions/download-artifact@v8.0.2
        with:
          name: channel-${{ matrix.subdir }}-default
          path: channel
      - name: Consumer env
        timeout-minutes: 20
        run: |
          set -euo pipefail
          chan="file:///$(cygpath -m "$PWD")/channel"
          ws="$(cygpath -m "$RUNNER_TEMP")/consumer"
          mkdir -p "$ws"
          {
            echo '[workspace]'
            echo 'name = "r-consumer"'
            echo "channels = [\"$chan\", \"https://prefix.dev/universe\", \"conda-forge\"]"
            echo "platforms = [\"$SUBDIR\"]"
            echo
            echo '[dependencies]'
            # build 12: the first r-zig that searches zig-libs (CONTRACT 6)
            for p in r-zig-slim r-zig-toolchain; do echo "$p = { version = \"4.6.2\", build = \"*_12\" }"; done
            for p in pkg-config $ZIG_LIBS $SYSDEPS; do echo "$p = \"*\""; done
          } > "$ws/pixi.toml"
          cat "$ws/pixi.toml"
          pixi install --manifest-path "$ws/pixi.toml"
          pixi list --manifest-path "$ws/pixi.toml" | tee "$ws/list.txt"
          # every zig-* library this run built from this run's channel (the
          # others from universe, D129)
          built=$(for f in channel/"$SUBDIR"/*.conda; do basename "$f" | sed -E 's/-[^-]+-[^-]+\.conda$//'; done | jq -R . | jq -sc .)
          echo "built in this run: $built"
          bad=$(pixi list --manifest-path "$ws/pixi.toml" --json |
            jq -r --arg c "$chan" --argjson b "$built" '.[] | select(.name as $n | $b | index($n)) | select((.source // "") != $c) | "\(.name) \(.build) \(.source)"')
          if [ -n "$bad" ]; then echo "::error::zig-* built here but not taken from this run's channel: $bad"; exit 1; fi
          echo "MANIFEST=$ws/pixi.toml" >> "$GITHUB_ENV"
          # r-zig build 12 finds zig-libs itself (R_ZIG_LIBS, PKG_CONFIG_PATH
          # and PKG_CONFIG_LIBDIR, R_TOOLS_SOFT in its Rcmd_environ;
          # CONTRACT 6). LOCAL_SOFT stays empty there; the install step
          # sets it (slice2 PLAN.md S2-F30, D124)
          case "$SUBDIR" in win-64) zt=x86_64-windows-gnu ;; win-arm64) zt=aarch64-windows-gnu ;; esac
          echo "ZIG_LIBS_TREE=$ws/.pixi/envs/default/Library/zig-libs/$zt" >> "$GITHUB_ENV"
          echo "RSCRIPT=$(cygpath -m "$ws/.pixi/envs/default/Library/lib/R/bin/x64/Rscript.exe")" >> "$GITHUB_ENV"
      # A throwaway PostgreSQL cluster in its own env (its libpq.pc never
      # reaches R's builds). The Smoke step starts and stops its server, so
      # no process outlives a step; tests/r/smoke.R reads R_SMOKE_PG.
      - name: PostgreSQL test cluster
        if: ${{ matrix.pgserver != '' }}
        timeout-minutes: 15
        env:
          PGSERVER: ${{ matrix.pgserver }}
        run: |
          set -euo pipefail
          pg="$(cygpath -m "$RUNNER_TEMP")/pgserver"
          mkdir -p "$pg"
          printf '[workspace]\nname = "pgserver"\nchannels = ["conda-forge"]\nplatforms = ["%s"]\n\n[dependencies]\npostgresql = "%s"\n' "$SUBDIR" "$PGSERVER" > "$pg/pixi.toml"
          pixi run --manifest-path "$pg/pixi.toml" initdb -D "$pg/data" -U postgres -A trust -E UTF8
          echo "PGSERVER_MANIFEST=$pg/pixi.toml" >> "$GITHUB_ENV"
      - name: Install the R packages from source
        timeout-minutes: 110
        env:
          R_INSTALL_LOGS: ${{ runner.temp }}/install-logs
        run: |
          # CRAN jpeg looks for libjpeg only in $(LOCAL_SOFT)/lib, which
          # r-zig build 12 leaves empty (S2-F30): zig-libs until r-zig decides
          export LOCAL_SOFT="$ZIG_LIBS_TREE"
          # one package per word
          # shellcheck disable=SC2086
          pixi run --manifest-path "$MANIFEST" "$RSCRIPT" "$(cygpath -m "$GITHUB_WORKSPACE/tests/r/install.R")" $PACKAGES
      - name: Smoke
        timeout-minutes: 10
        run: |
          set -euo pipefail
          if [ -n "${PGSERVER_MANIFEST:-}" ]; then
            pg="$(dirname "$PGSERVER_MANIFEST")"
            pixi run --manifest-path "$PGSERVER_MANIFEST" pg_ctl -D "$pg/data" -o "-p 5544" -l "$pg/server.log" -w start
            trap 'pixi run --manifest-path "$PGSERVER_MANIFEST" pg_ctl -D "$pg/data" -m fast -w stop || true' EXIT
            export R_SMOKE_PG="host=127.0.0.1 port=5544 user=postgres dbname=postgres sslmode=disable"
          fi
          # shellcheck disable=SC2086
          pixi run --manifest-path "$MANIFEST" "$RSCRIPT" "$(cygpath -m "$GITHUB_WORKSPACE/tests/r/smoke.R")" $PACKAGES | tee smoke.txt
          grep '^SMOKE' smoke.txt | sed 's/^/- /' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: r-consumer-${{ matrix.subdir }}
          path: |
            ${{ runner.temp }}/install-logs
            ${{ runner.temp }}/consumer/pixi.toml
            ${{ runner.temp }}/consumer/list.txt
          if-no-files-found: warn
          retention-days: 14

  alignment:
    name: build-number alignment
    needs: [plan, cross]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.any == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@v0.11.3
        with:
          pixi-version: v0.84.2
          environments: default
          cache: true
          cache-write: ${{ github.event_name == 'push' && github.ref_name == 'main' }}
      # the default env's channels only: the upstream-zig leg builds the
      # same recipes and is never published. A missing artifact (a failed
      # cross leg) shows as a missing subdir (--expect in pixi.toml).
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: channel-*-default
          path: channels
      - name: zig-toolchain check-alignment
        run: pixi run --locked check-alignment "$(echo channels/channel-*-default)"

  # Uploads the default leg's packages (zig-toolchain for linux-64, every
  # library for win-64 and win-arm64; only those not yet published, D96)
  # to prefix.dev universe by trusted publishing (OIDC): `id-token: write`,
  # here only, lets rattler-build mint a short-lived token, no stored key.
  # Requires luciorq/libs-zig-pixi / build.yml registered as a Trusted
  # Publisher on universe (DESIGN 9.1).
  # CONDA_PUBLISH is a release switch, as r-zig-pixi's: unset between
  # releases, so a merge without a build-number bump uploads nothing. For
  # a release: merge the bump, `gh variable set CONDA_PUBLISH --body true`,
  # dispatch this workflow on main, check universe, then
  # `gh variable delete CONDA_PUBLISH`. Every job it needs must have
  # succeeded (also a gated upstream-zig leg of a dispatch), or been
  # skipped because plan selected no recipe (D129): then only
  # zig-toolchain can be new.
  publish:
    name: publish to prefix.dev universe
    needs: [plan, toolchain, cross, test, r-consumer, alignment]
    if: >-
      !cancelled() &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      vars.CONDA_PUBLISH == 'true' &&
      needs.plan.result == 'success' && needs.toolchain.result == 'success' &&
      ((needs.plan.outputs.any == 'true' &&
        needs.cross.result == 'success' && needs.test.result == 'success' &&
        needs.r-consumer.result == 'success' && needs.alignment.result == 'success') ||
       (needs.plan.outputs.any != 'true' &&
        needs.cross.result == 'skipped' && needs.test.result == 'skipped' &&
        needs.r-consumer.result == 'skipped' && needs.alignment.result == 'skipped'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      # (the packages come from the artifacts; the checkout is for setup-pixi)
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@v0.11.3
        with:
          pixi-version: v0.84.2
          run-install: false
      # This run's artifacts (no run-id), by name: the default leg's only,
      # never a channel-*-upstream-zig one (same file names, D29)
      - uses: actions/download-artifact@v8.0.2
        with:
          name: channel-linux-64-default
          path: channels/linux-64
      - uses: actions/download-artifact@v8.0.2
        if: needs.plan.outputs.any == 'true'
        with:
          name: channel-win-64-default
          path: channels/win-64
      - uses: actions/download-artifact@v8.0.2
        if: needs.plan.outputs.any == 'true'
        with:
          name: channel-win-arm64-default
          path: channels/win-arm64
      # The pre-upload guard (D29). Both legs give the same file names and
      # build strings (M0-F8), so the leg is read from each package's
      # info/recipe/rendered_recipe.yaml: the upstream-zig leg's has
      # `ZIG_BIN: <ziglang path>` in build.script.env (the default leg's
      # has no ZIG_BIN, the empty default is dropped), and its build_prefix
      # is under the leg's output dir, $LIBS_ZIG_OUT/bld for the default
      # leg. Also: only zig-toolchain for linux-64, at least one library
      # per Windows subdir when plan selected recipes (none otherwise,
      # D129), index.json's subdir matches the directory.
      - name: Guard (default leg only, D29)
        env:
          ANY: ${{ needs.plan.outputs.any }}
        run: |
          : > publish.txt
          bad=0
          for sd in linux-64 win-64 win-arm64; do
            n=0
            for f in channels/"$sd"/"$sd"/*.conda; do
              [ -e "$f" ] || continue
              n=$((n + 1))
              info=$(unzip -Z1 "$f" 'info-*.tar.zst')
              rendered=$(unzip -p "$f" "$info" | tar --zstd -xOf - info/recipe/rendered_recipe.yaml)
              subdir=$(unzip -p "$f" "$info" | tar --zstd -xOf - info/index.json |
                python3 -c 'import json, sys; print(json.load(sys.stdin)["subdir"])')
              zig_bin=$(printf '%s\n' "$rendered" | sed -n 's/^ *ZIG_BIN: *//p')
              prefix=$(printf '%s\n' "$rendered" | sed -n 's/^ *build_prefix: *//p')
              why=()
              [ -z "$zig_bin" ] || why+=("ZIG_BIN=$zig_bin")
              case "$prefix" in
                "$LIBS_ZIG_OUT"/bld/*) ;;
                *) why+=("build_prefix=${prefix:-none}") ;;
              esac
              [ "$subdir" = "$sd" ] || why+=("index.json subdir=$subdir")
              if [ "$sd" = linux-64 ]; then
                case "$(basename "$f")" in
                  zig-toolchain-*) ;;
                  *) why+=("not zig-toolchain") ;;
                esac
              fi
              if [ "${#why[@]}" -gt 0 ]; then
                echo "::error::$f: ${why[*]}"
                bad=1
              else
                echo "$f" >> publish.txt
              fi
            done
            echo "$sd: $n package(s)"
            case "$sd:$ANY" in
              linux-64:*|win-*:true) [ "$n" -gt 0 ] || { echo "::error::no packages for $sd"; bad=1; } ;;
              *) [ "$n" -eq 0 ] || { echo "::error::$sd packages although plan selected none"; bad=1; } ;;
            esac
          done
          cat publish.txt
          [ "$bad" -eq 0 ]
      # R15 before any upload (D96). A file name holds the variant hash and
      # the build number, not the recipe text, so a rebuild of a published
      # package keeps its name. Each file of publish.txt is fetched from
      # universe by name (anonymous; 404 = not published): a new file goes
      # to upload.txt; a published one is compared with this run's on the
      # files that come from the repo, which are info/recipe/ (recipe.yaml,
      # build.sh, patches, other files of the recipe dir) without
      # rendered_recipe.yaml (build paths, timestamp, the runner's virtual
      # packages) and variant_config.yaml (the variant is in the hash; its
      # layout is rattler-build's), plus the sha256 of the package's test
      # files (etc/conda/test-files/, from tests/) in info/paths.json. The
      # same: left as published, not uploaded. Different: the job fails
      # here, naming the files, before anything is uploaded (a recipe change
      # without a build-number bump). Not covered: the build itself (not
      # byte-reproducible) and path sources that ship only as build output
      # (toolchain/ in zig-toolchain). UNIVERSE_URL is overridden only by
      # the local test of this step (m5 PLAN.md).
      - name: New or published with the same recipe (D96, R15)
        env:
          UNIVERSE_URL: https://repo.prefix.dev/universe
        run: |
          : > upload.txt
          tmp=$RUNNER_TEMP/d96
          # a channel URL with a typo answers 404 for every file, which would
          # read as "new" (D87 makes the same check)
          curl -sSfL --retry 3 -o /dev/null "$UNIVERSE_URL/noarch/repodata.json" ||
            { echo "::error::$UNIVERSE_URL/noarch/repodata.json is not served"; exit 1; }
          recipe_files() { # <.conda> <dir>: the compared files into <dir>
            mkdir -p "$2"
            unzip -p "$1" "$(unzip -Z1 "$1" 'info-*.tar.zst')" |
              tar --zstd -xf - -C "$2" info/recipe info/paths.json
            rm -f "$2"/info/recipe/rendered_recipe.yaml "$2"/info/recipe/variant_config.yaml
            python3 -c 'import json, sys
          for p in sorted(json.load(open(sys.argv[1]))["paths"], key=lambda p: p["_path"]):
              if p["_path"].startswith("etc/conda/test-files/"):
                  print(p["_path"], p.get("sha256"))' "$2"/info/paths.json > "$2"/info/test-files.sha256
            rm "$2"/info/paths.json
          }
          echo "| package | subdir | universe before upload |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|---|" >> "$GITHUB_STEP_SUMMARY"
          bad=0
          while IFS= read -r f; do
            sd=$(basename "$(dirname "$f")") fn=$(basename "$f")
            rm -rf "$tmp" && mkdir -p "$tmp"
            # a published file answers 303 to packages.prefix.dev; a 404
            # after that redirect is a CDN error, not "new"
            code=$(curl -sSL --retry 3 -o "$tmp/published.conda" -w '%{http_code}/%{num_redirects}' "$UNIVERSE_URL/$sd/$fn") || code="curl exit $?"
            case "$code" in
              404/0) r=new; echo "$f" >> upload.txt ;;
              200/*)
                recipe_files "$f" "$tmp/run"
                recipe_files "$tmp/published.conda" "$tmp/published"
                if differ=$(cd "$tmp" && diff -rq published run); then
                  r="published, same recipe"
                else
                  r="RECIPE DIFFERS: $(printf '%s\n' "$differ" |
                    sed -E 's#^Files published/info/([^ ]*) and .*#\1#; s#^Only in (published|run)/info/?(.*): (.*)#\2/\3 (only \1)#; s#^/##' |
                    paste -sd ' ')"
                  echo "::error::$f: published on universe with other recipe files, bump build.number (R15): ${r#*: }"
                  (cd "$tmp" && diff -r published run) || true
                  bad=1
                fi
                ;;
              *) r="ERROR ($code)"; echo "::error::$UNIVERSE_URL/$sd/$fn: $code"; bad=1 ;;
            esac
            echo "$fn ($sd): $r"
            echo "| \`$fn\` | $sd | $r |" >> "$GITHUB_STEP_SUMMARY"
          done < publish.txt
          echo >> "$GITHUB_STEP_SUMMARY"
          rm -rf "$tmp"
          echo "to upload: $(wc -l < upload.txt) of $(wc -l < publish.txt)"
          [ "$bad" -eq 0 ]
      # -v: without it a successful upload prints nothing (flang-pixi
      # docs/14). Only the new files (upload.txt); none is a success. A file
      # skipped here appeared on universe after the step above (a parallel
      # upload); the verify step fails if its content differs from this
      # run's.
      - name: Upload (OIDC trusted publishing)
        run: |
          mapfile -t files < upload.txt
          if [ "${#files[@]}" -eq 0 ]; then
            echo "nothing new to upload"
            exit 0
          fi
          pixi exec --spec "rattler-build==$RATTLER_BUILD_VERSION" -- \
            rattler-build -v upload prefix --channel universe --skip-existing "${files[@]}" 2>&1 | tee upload.log
          if grep -i 'already exists' upload.log > skipped.log; then
            while IFS= read -r line; do
              echo "::warning::skipped (--skip-existing): $line"
            done < skipped.log
          fi
      # Every file this run uploaded (upload.txt) must be on universe under
      # its subdir with this run's sha256 (a skipped file with other content
      # is the R15 pitfall); the published ones with the same recipe were
      # checked above (D96). GraphQL, not repodata.json: the channel
      # re-indexes asynchronously (flang-pixi build.yml). The API answers a
      # public channel without a key.
      - name: Verify on universe
        shell: python
        run: |
          import hashlib, json, os, sys, time, urllib.request
          want = {}
          for path in open("upload.txt").read().split():
              with open(path, "rb") as f:
                  sha = hashlib.sha256(f.read()).hexdigest()
              want[os.path.basename(path)] = (path.split("/")[-2], sha)
          if not want:
              print("nothing uploaded, nothing to verify")
              sys.exit(0)
          names = sorted({fn.rsplit("-", 2)[0] for fn in want})
          def published():
              have = {}
              for name in names:
                  q = {"query": '{ channel(name:"universe") { packages(filters:{name:{eq:"%s"}}, limit:1) { page { variants(includeHidden:true, limit:100) { page { filename platform sha256 hidden activeQuarantines { reason } } } } } } }' % name}
                  req = urllib.request.Request("https://prefix.dev/api/graphql", data=json.dumps(q).encode(),
                                               headers={"Content-Type": "application/json"})
                  d = json.load(urllib.request.urlopen(req, timeout=60))
                  for pk in d["data"]["channel"]["packages"]["page"]:
                      for v in pk["variants"]["page"]:
                          have[v["filename"]] = v
              return have
          for attempt in range(6):
              have = published()
              missing = [fn for fn in want if fn not in have]
              if not missing:
                  break
              print("not yet listed:", *missing)
              time.sleep(20)
          bad = []
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write("| package | subdir | universe |\n|---|---|---|\n")
              for fn, (subdir, sha) in sorted(want.items()):
                  v = have.get(fn)
                  if v is None:
                      r = "MISSING"
                  elif v["platform"] != subdir:
                      r = "WRONG SUBDIR " + v["platform"]
                  elif v["sha256"] != sha:
                      r = "OTHER CONTENT (sha256 %s, skipped by --skip-existing?)" % v["sha256"]
                  elif v["hidden"] or v["activeQuarantines"]:
                      r = "HIDDEN/QUARANTINED %s" % v["activeQuarantines"]
                  else:
                      r = "ok"
                  if r != "ok":
                      bad.append(fn)
                  print(fn, subdir, r)
                  summary.write("| `%s` | %s | %s |\n" % (fn, subdir, r))
          print("verified on universe:", len(want) - len(bad), "of", len(want))
          sys.exit(1 if bad else 0)
