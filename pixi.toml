[workspace]
name = "libs-zig-pixi"
description = "Static C/C++ libraries cross-built with zig as conda packages (zig-* on universe)"
channels = ["conda-forge"]
platforms = ["linux-64"]

# The build host env. rattler-build makes its own build/host envs from
# conda channels; this env only runs rattler-build and the smoke links.
[dependencies]
rattler-build = "*"
zig = "==0.17.1"
cmake = "*"
ninja = "*"
pkgconf = "*"
perl = "*"
sqlite = "*"

# LIBS_ZIG_OUT: rattler-build's output dir and local channel (file://).
# The default is the gitignored output/ in the workspace; a machine with a
# bigger scratch disk sets LIBS_ZIG_OUT (and RATTLER_CACHE_DIR,
# ZIG_GLOBAL_CACHE_DIR) in its own shell profile, never here. The
# `${VAR:-default}` form keeps a value set by the caller.
# ZIG_BIN is cleared: the default env is the published leg and always runs
# the build env's conda-forge zig (D11), even when the caller's shell
# exports ZIG_BIN (r-zig-pixi's docs do). The upstream-zig env sets it.
[activation.env]
LIBS_ZIG_OUT = "${LIBS_ZIG_OUT:-$PIXI_PROJECT_ROOT/output}"
ZIG_BIN = ""

[tasks.build-toolchain]
description = "Build zig-toolchain for linux-64 into $LIBS_ZIG_OUT"
cmd = "rattler-build build --recipe recipes/zig-toolchain -m variants.yaml --output-dir $LIBS_ZIG_OUT -c conda-forge --no-build-id"

[tasks.build]
description = "Build recipes/<recipe> for <subdir> (win-64 | win-arm64) against the local channel"
args = ["recipe", { arg = "subdir", default = "win-64" }]
cmd = "rattler-build build --recipe recipes/{{ recipe }} --target-platform {{ subdir }} -m variants.yaml --output-dir $LIBS_ZIG_OUT -c file://$LIBS_ZIG_OUT -c conda-forge --no-build-id"

# Every library recipe for one subdir, in dependency order: pixi runs
# depends-on in the order listed. A new recipe is one line here. CI runs
# this (build.yml), so the list lives only here. zig-openssl needs
# zig-zlib; zig-proj zig-sqlite; zig-gdal zig-proj, zig-geos, zig-sqlite,
# zig-expat and zig-zlib (their host requirements).
[tasks.build-libs]
description = "Build every library recipe for <subdir> (win-64 | win-arm64), in dependency order"
args = [{ arg = "subdir", default = "win-64" }]
depends-on = [
  { task = "build", args = ["zig-zlib", "{{ subdir }}"] },
  { task = "build", args = ["zig-sqlite", "{{ subdir }}"] },
  { task = "build", args = ["zig-expat", "{{ subdir }}"] },
  { task = "build", args = ["zig-openssl", "{{ subdir }}"] },
  { task = "build", args = ["zig-abseil", "{{ subdir }}"] },
  { task = "build", args = ["zig-onetbb", "{{ subdir }}"] },
  { task = "build", args = ["zig-geos", "{{ subdir }}"] },
  { task = "build", args = ["zig-proj", "{{ subdir }}"] },
  { task = "build", args = ["zig-gdal", "{{ subdir }}"] },
]

# One build number per package across subdirs (D17, CONVENTIONS.md). The
# subdirs every library must be in are listed here; zig-toolchain
# (linux-64 only) is checked by the build-number rule alone. <dirs>: channel
# roots or subdir dirs, space-separated (CI passes one per artifact).
# The binary is installed into toolchain/zig-out (gitignored) and run
# directly, so its exit codes (0 aligned, 1 problem, 2 usage) and a log
# without build-runner lines reach the caller (D42).
[tasks.check-alignment]
description = "zig-toolchain check-alignment over <dirs> (default $LIBS_ZIG_OUT), compared with the <published> channel (default universe; a URL or a channel dir)"
args = [{ arg = "dirs", default = "$LIBS_ZIG_OUT" }, { arg = "published", default = "https://prefix.dev/universe" }]
cmd = "zig build --build-file toolchain/build.zig --prefix toolchain/zig-out && toolchain/zig-out/bin/zig-toolchain check-alignment --expect win-64,win-arm64 --published={{ published }} {{ dirs }}"

[tasks.test]
description = "Re-run a built package's tests (the parts that run on linux)"
args = ["package_file"]
cmd = "rattler-build test --package-file {{ package_file }} -c file://$LIBS_ZIG_OUT -c conda-forge"

[tasks.smoke]
description = "Cross-link smoke sources (tests/smoke/<file>, comma-separated) against the built zig-* packages of <subdir> with tests/pkgtest.zig; keeps the executables"
args = ["modules", "sources", { arg = "subdir", default = "win-64" }]
cmd = "bash tests/smoke/link.sh {{ subdir }} {{ modules }} {{ sources }}"

[tasks.toolchain-test]
description = "zig build test of the zig-toolchain sources"
cwd = "toolchain"
cmd = "zig build test"

# Both zigs (D11): the same tools, plus upstream zig from PyPI. ZIG_BIN
# points at it; the zig-toolchain wrappers run $ZIG_BIN when it is set, and
# the recipes pass it into rattler-build's build script (build.script.env).
[feature.upstream-zig.dependencies]
python = "3.13.*"

[feature.upstream-zig.pypi-dependencies]
ziglang = "==0.17.1"

# Its own output dir: its packages have the same file names and build
# strings as the published leg's (ZIG_BIN is not a variant), so they must
# never land in, or be uploaded from, LIBS_ZIG_OUT. Rebuild zig-toolchain
# here too (pixi run -e upstream-zig build-toolchain) before the libraries.
[feature.upstream-zig.activation.env]
ZIG_BIN = "$CONDA_PREFIX/lib/python3.13/site-packages/ziglang/zig"
LIBS_ZIG_OUT = "${LIBS_ZIG_OUT_UPSTREAM:-$PIXI_PROJECT_ROOT/output-upstream}"

[environments]
upstream-zig = ["upstream-zig"]
