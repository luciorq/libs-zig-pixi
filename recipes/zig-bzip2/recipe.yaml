# zig-bzip2: libbz2 (bzip2), static only, for Windows (win-64, win-arm64),
# cross-built on linux with zig-toolchain through upstream's own Makefile
# target libbz2.a (D1; 1.0.8 has no configure and no CMake). Installed
# under the private sub-prefix Library/zig-libs/<zig triple>/ (D2):
# lib/libbz2.a, include/bzlib.h, lib/pkgconfig/bzip2.pc (written by
# build.sh: upstream installs none; closed, relocatable), licenses/bzip2/.
context:
  # MXE's bzip2.mk (the last release), variants.yaml
  version: ${{ bzip2_version }}
  zt: ${{ "aarch64-windows-gnu" if target_platform == "win-arm64" else "x86_64-windows-gnu" }}
  sub: Library/zig-libs/${{ zt }}

package:
  name: zig-bzip2
  version: ${{ version }}

source:
  - url: https://sourceware.org/pub/bzip2/bzip2-${{ version }}.tar.gz
    sha256: ab5a03176ee106d3f0fa90e381da478ddae405918153cca248e682cd0c4a2269
  # the package test (tests/pkgtest.zig, tests/smoke/bzip2.c), for
  # tests.files below; the build does not use it
  - path: ../../tests
    target_directory: zig-libs-tests

build:
  number: 0
  string: zig_${{ hash }}_${{ build_number }}
  script:
    file: build.sh
    env:
      # both zigs (D11): the upstream-zig leg sets ZIG_BIN to PyPI
      # ziglang's zig; empty means the build env's conda-forge zig
      ZIG_BIN: ${{ env.get("ZIG_BIN", default="") }}
      ZIG_TOOLCHAIN_TRACE: ${{ env.get("ZIG_TOOLCHAIN_TRACE", default="") }}
      # zig's global cache shared across recipes (CI; slice2 D115); empty
      # means one under SRC_DIR (zig-toolchain activation)
      LIBS_ZIG_CACHE: ${{ env.get("LIBS_ZIG_CACHE", default="") }}
      ZIG_VERSION: ${{ zig }}

requirements:
  build:
    # exact: puts zig_toolchain in the hash (variants.yaml)
    - zig-toolchain ==${{ zig_toolchain }}
    - zig ==${{ zig }}
    # upstream's Makefile; exact: puts make in the hash (variants.yaml)
    - make ==${{ make }}
  run_exports:
    weak:
      - ${{ pin_subpackage("zig-bzip2", upper_bound="x.x.x") }}

tests:
  - package_contents:
      files:
        exists:
          - ${{ sub }}/lib/libbz2.a
          - ${{ sub }}/include/bzlib.h
          - ${{ sub }}/lib/pkgconfig/bzip2.pc
          - ${{ sub }}/licenses/bzip2/LICENSE
        # static only (D3): no DLL, no import library, no MSVC-named
        # library; no bzip2 programs or scripts, no man pages
        not_exists:
          - "**/*.dll"
          - "**/*.dll.a"
          - "**/*.lib"
          - "**/*.exe"
          - ${{ sub }}/bin/**
          - ${{ sub }}/share/**
          - ${{ sub }}/man/**
  # tests/pkgtest.zig (its header says what it checks): the relocated .pc
  # resolves to existing paths, no absolute prefix in it, no build path in
  # libbz2.a, no dllexport directive, and tests/smoke/bzip2.c links (and
  # runs, on Windows of the same arch: a buffer round trip and the
  # library version). One plain command for bash (linux) and cmd.exe
  # (Windows).
  - script:
      - zig run --cache-dir .zig-local-cache zig-libs-tests/pkgtest.zig -- --unique-c-symbols --no-dllexport ${{ zt }} bzip2 zig-libs-tests/smoke/bzip2.c
    files:
      source:
        - zig-libs-tests/pkgtest.zig
        - zig-libs-tests/smoke/bzip2.c
    requirements:
      build:
        - zig ==${{ zig }}
        - pkgconf
        - llvm-tools

about:
  homepage: https://sourceware.org/bzip2/
  license: bzip2-1.0.6
  license_file: LICENSE
  summary: libbz2 (bzip2 compression), static library for Windows built with zig (private zig-libs sub-prefix)
  repository: https://sourceware.org/git/bzip2.git
