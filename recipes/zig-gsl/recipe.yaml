# zig-gsl: the GNU Scientific Library, static only, for Windows (win-64,
# win-arm64), cross-built on linux with zig-toolchain through GSL's own
# autotools configure (D1), run by `zig-toolchain configure` (slice2
# D104), as CRAN's Rtools45 build (plain configure; slice2 S2-F21).
# Installed under the private sub-prefix Library/zig-libs/<zig triple>/
# (D2): lib/libgsl.a, lib/libgslcblas.a (GSL's own CBLAS), include/gsl/,
# lib/pkgconfig/gsl.pc (upstream's, closed and relocatable),
# licenses/gsl/.
context:
  # Rtools45 build 6768 (slice2 S2-F1), variants.yaml
  version: ${{ gsl_version }}
  zt: ${{ "aarch64-windows-gnu" if target_platform == "win-arm64" else "x86_64-windows-gnu" }}
  sub: Library/zig-libs/${{ zt }}

package:
  name: zig-gsl
  version: ${{ version }}

source:
  - url:
      - https://ftp.gnu.org/gnu/gsl/gsl-${{ version }}.tar.gz
      - https://ftpmirror.gnu.org/gnu/gsl/gsl-${{ version }}.tar.gz
    sha256: dcb0fbd43048832b757ff9942691a8dd70026d5da0ff85601e52687f6deeb34b
  # the package test (tests/pkgtest.zig, tests/smoke/gsl.c), for
  # tests.files below; the build does not use it
  - path: ../../tests
    target_directory: zig-libs-tests

build:
  number: 0
  string: zig_${{ hash }}_${{ build_number }}
  script:
    file: build.sh
    env:
      # both zigs (D11): the upstream-zig leg sets ZIG_BIN to PyPI
      # ziglang's zig; empty means the build env's conda-forge zig
      ZIG_BIN: ${{ env.get("ZIG_BIN", default="") }}
      ZIG_TOOLCHAIN_TRACE: ${{ env.get("ZIG_TOOLCHAIN_TRACE", default="") }}
      # zig's global cache shared across recipes (CI; slice2 D115); empty
      # means one under SRC_DIR (zig-toolchain activation)
      LIBS_ZIG_CACHE: ${{ env.get("LIBS_ZIG_CACHE", default="") }}
      ZIG_VERSION: ${{ zig }}

requirements:
  build:
    # exact: puts zig_toolchain in the hash (variants.yaml)
    - zig-toolchain ==${{ zig_toolchain }}
    - zig ==${{ zig }}
    # configure and make; exact: puts make and llvm_tools in the hash
    # (variants.yaml). llvm-nm is configure's NM (zig-toolchain configure).
    - make ==${{ make }}
    - llvm-tools ==${{ llvm_tools }}
  run_exports:
    weak:
      - ${{ pin_subpackage("zig-gsl", upper_bound="x.x") }}

tests:
  - package_contents:
      files:
        exists:
          - ${{ sub }}/lib/libgsl.a
          - ${{ sub }}/lib/libgslcblas.a
          - ${{ sub }}/include/gsl/gsl_version.h
          - ${{ sub }}/include/gsl/gsl_cblas.h
          - ${{ sub }}/lib/pkgconfig/gsl.pc
          - ${{ sub }}/licenses/gsl/COPYING
        # static only (D3): no DLL, no import library, no MSVC-named
        # library; no libtool archive, no programs, no gsl-config (a shell
        # script with the build prefix in it; gsl.pc says the same)
        not_exists:
          - "**/*.dll"
          - "**/*.dll.a"
          - "**/*.lib"
          - "**/*.la"
          - "**/*.exe"
          - ${{ sub }}/bin/**
          - ${{ sub }}/share/**
  # tests/pkgtest.zig (its header says what it checks): gsl.pc names
  # -lgslcblas next to -lgsl; the relocated .pc resolves to existing
  # paths, no absolute prefix in it, no build path in the archives, no C
  # symbol in both libgsl.a and libgslcblas.a, no dllexport directive,
  # and tests/smoke/gsl.c links (and runs, on Windows of the same arch:
  # special functions, BLAS through gslcblas, an integral, an ODE, an RNG
  # draw). One plain command for bash (linux) and cmd.exe (Windows).
  - script:
      - zig run --cache-dir .zig-local-cache zig-libs-tests/pkgtest.zig -- --unique-c-symbols --no-dllexport --require -lgslcblas ${{ zt }} gsl zig-libs-tests/smoke/gsl.c
    files:
      source:
        - zig-libs-tests/pkgtest.zig
        - zig-libs-tests/smoke/gsl.c
    requirements:
      build:
        - zig ==${{ zig }}
        - pkgconf
        - llvm-tools

about:
  homepage: https://www.gnu.org/software/gsl/
  license: GPL-3.0-or-later
  license_file: COPYING
  summary: GNU Scientific Library, static library for Windows built with zig (private zig-libs sub-prefix)
  repository: https://ftp.gnu.org/gnu/gsl/
