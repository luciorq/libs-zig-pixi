# zig-libaec: libaec (Adaptive Entropy Coding, the szip replacement),
# static only, for Windows (win-64, win-arm64), cross-built on linux with
# zig-toolchain through libaec's own CMake build (D1); szip and HDF4 for
# hdf5/netcdf, as Rtools45 (slice2 D127 C). 1.0.6 as Rtools45's MXE
# (aec.mk). Installed under the private sub-prefix Library/zig-libs/<zig
# triple>/ (D2): lib/libaec.a, lib/libsz.a (szip API, self-contained),
# include/{libaec,szlib}.h, lib/pkgconfig/{libaec,szip}.pc (written by the
# recipe, upstream ships none; closed, relocatable), licenses/libaec/.
context:
  version: ${{ libaec_version }}
  zt: ${{ "aarch64-windows-gnu" if target_platform == "win-arm64" else "x86_64-windows-gnu" }}
  sub: Library/zig-libs/${{ zt }}

package:
  name: zig-libaec
  version: ${{ version }}

source:
  - url: https://gitlab.dkrz.de/k202009/libaec/-/archive/v${{ version }}/libaec-v${{ version }}.tar.bz2
    sha256: 31fb65b31e835e1a0f3b682d64920957b6e4407ee5bbf42ca49549438795a288
  # the package test (tests/pkgtest.zig, tests/smoke/libaec.c), for
  # tests.files below; the build does not use it
  - path: ../../tests
    target_directory: zig-libs-tests

build:
  number: 0
  string: zig_${{ hash }}_${{ build_number }}
  script:
    file: build.sh
    env:
      # both zigs (D11): the upstream-zig leg sets ZIG_BIN to PyPI
      # ziglang's zig; empty means the build env's conda-forge zig
      ZIG_BIN: ${{ env.get("ZIG_BIN", default="") }}
      ZIG_TOOLCHAIN_TRACE: ${{ env.get("ZIG_TOOLCHAIN_TRACE", default="") }}
      # zig's global cache shared across recipes (CI; slice2 D115); empty
      # means one under SRC_DIR (zig-toolchain activation)
      LIBS_ZIG_CACHE: ${{ env.get("LIBS_ZIG_CACHE", default="") }}
      ZIG_VERSION: ${{ zig }}

requirements:
  build:
    # exact: puts zig_toolchain in the hash (variants.yaml)
    - zig-toolchain ==${{ zig_toolchain }}
    - zig ==${{ zig }}
    # exact: puts cmake and ninja in the hash (variants.yaml)
    - cmake ==${{ cmake }}
    - ninja ==${{ ninja }}
  run_exports:
    weak:
      - ${{ pin_subpackage("zig-libaec", upper_bound="x") }}

tests:
  - package_contents:
      files:
        exists:
          - ${{ sub }}/lib/libaec.a
          - ${{ sub }}/lib/libsz.a
          - ${{ sub }}/include/libaec.h
          - ${{ sub }}/include/szlib.h
          - ${{ sub }}/lib/pkgconfig/libaec.pc
          - ${{ sub }}/lib/pkgconfig/szip.pc
          - ${{ sub }}/licenses/libaec/LICENSE.txt
        # static only (D3): no DLL, no import library, no MSVC-named
        # library; no aec tool, no man page, no CMake config
        not_exists:
          - "**/*.dll"
          - "**/*.dll.a"
          - "**/*.lib"
          - "**/*.exe"
          - ${{ sub }}/bin/**
          - ${{ sub }}/share/**
          - ${{ sub }}/cmake/**
          - ${{ sub }}/lib/cmake/**
  # tests/pkgtest.zig (its header says what it checks), once per .pc:
  # libaec.pc and szip.pc are alternatives (libsz.a holds the aec_*
  # objects too), so they are not checked as one closure. Each relocated
  # .pc resolves to existing paths, no absolute prefix in it, no build
  # path in the archive, no dllexport directive; tests/smoke/libaec.c
  # links against szip.pc (and runs, on Windows of the same arch: a buffer
  # compressed and decompressed through SZ_BufftoBuff* and aec_buffer_*,
  # both in libsz.a). One plain command per line for bash (linux) and
  # cmd.exe (Windows).
  - script:
      - zig run --cache-dir .zig-local-cache zig-libs-tests/pkgtest.zig -- --unique-c-symbols --no-dllexport --require -lsz --forbid -laec ${{ zt }} szip zig-libs-tests/smoke/libaec.c
      - zig run --cache-dir .zig-local-cache zig-libs-tests/pkgtest.zig -- --unique-c-symbols --no-dllexport --require -laec ${{ zt }} libaec
    files:
      source:
        - zig-libs-tests/pkgtest.zig
        - zig-libs-tests/smoke/libaec.c
    requirements:
      build:
        - zig ==${{ zig }}
        - pkgconf
        - llvm-tools

about:
  homepage: https://gitlab.dkrz.de/k202009/libaec
  license: BSD-2-Clause
  license_file: LICENSE.txt
  summary: libaec (Adaptive Entropy Coding, szip-compatible), static library for Windows built with zig (private zig-libs sub-prefix)
  repository: https://gitlab.dkrz.de/k202009/libaec
