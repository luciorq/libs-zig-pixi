# zig-nlopt: NLopt, static only, for Windows (win-64, win-arm64),
# cross-built on linux with zig-toolchain through NLopt's own CMake build
# (D1), with its C++ algorithms (StoGO, AGS) as Rtools45 builds it; libc++
# as zig links it. Installed under the private sub-prefix
# Library/zig-libs/<zig triple>/ (D2): lib/libnlopt.a,
# include/{nlopt.h,nlopt.hpp}, lib/pkgconfig/nlopt.pc (closed,
# relocatable: -lnlopt -lm -lc++), lib/cmake/nlopt/, licenses/nlopt/.
context:
  # Rtools45 build 6768 (slice2 S2-F1), variants.yaml
  version: ${{ nlopt_version }}
  zt: ${{ "aarch64-windows-gnu" if target_platform == "win-arm64" else "x86_64-windows-gnu" }}
  sub: Library/zig-libs/${{ zt }}

package:
  name: zig-nlopt
  version: ${{ version }}

source:
  # GitHub's tag archive (the release has no asset)
  - url: https://github.com/stevengj/nlopt/archive/refs/tags/v${{ version }}.tar.gz
    sha256: 506f83a9e778ad4f204446e99509cb2bdf5539de8beccc260a014bd560237be1
  # the package test (tests/pkgtest.zig, tests/smoke/nlopt.c), for
  # tests.files below; the build does not use it
  - path: ../../tests
    target_directory: zig-libs-tests

build:
  number: 0
  string: zig_${{ hash }}_${{ build_number }}
  script:
    file: build.sh
    env:
      # both zigs (D11): the upstream-zig leg sets ZIG_BIN to PyPI
      # ziglang's zig; empty means the build env's conda-forge zig
      ZIG_BIN: ${{ env.get("ZIG_BIN", default="") }}
      ZIG_TOOLCHAIN_TRACE: ${{ env.get("ZIG_TOOLCHAIN_TRACE", default="") }}
      # zig's global cache shared across recipes (CI; slice2 D115); empty
      # means one under SRC_DIR (zig-toolchain activation)
      LIBS_ZIG_CACHE: ${{ env.get("LIBS_ZIG_CACHE", default="") }}
      ZIG_VERSION: ${{ zig }}

requirements:
  build:
    # exact: puts zig_toolchain in the hash (variants.yaml)
    - zig-toolchain ==${{ zig_toolchain }}
    - zig ==${{ zig }}
    # exact: puts cmake and ninja in the hash (variants.yaml)
    - cmake ==${{ cmake }}
    - ninja ==${{ ninja }}
  run_exports:
    weak:
      - ${{ pin_subpackage("zig-nlopt", upper_bound="x.x") }}

tests:
  - package_contents:
      files:
        exists:
          - ${{ sub }}/lib/libnlopt.a
          - ${{ sub }}/include/nlopt.h
          - ${{ sub }}/include/nlopt.hpp
          - ${{ sub }}/lib/pkgconfig/nlopt.pc
          - ${{ sub }}/lib/cmake/nlopt/NLoptConfig.cmake
          - ${{ sub }}/licenses/nlopt/COPYING
          - ${{ sub }}/licenses/nlopt/COPYRIGHT
        # static only (D3): no DLL, no import library, no MSVC-named library
        not_exists:
          - "**/*.dll"
          - "**/*.dll.a"
          - "**/*.lib"
  # tests/pkgtest.zig (its header says what it checks): nlopt.pc names
  # -lc++ (the C++ algorithms inside libnlopt.a); the relocated .pc resolves
  # to existing paths, no absolute prefix in it, no build path in the
  # archive, libc++ only, no dllexport directive, and tests/smoke/nlopt.c
  # (a C program, Nelder-Mead and StoGO) links with zig cc and the .pc's
  # flags alone (and runs, on Windows of the same arch). One plain command
  # for bash (linux) and cmd.exe (Windows).
  - script:
      - zig run --cache-dir .zig-local-cache zig-libs-tests/pkgtest.zig -- --libcxx --no-dllexport --require -lc++ --forbid -lstdc++ ${{ zt }} nlopt zig-libs-tests/smoke/nlopt.c
    files:
      source:
        - zig-libs-tests/pkgtest.zig
        - zig-libs-tests/smoke/nlopt.c
    requirements:
      build:
        - zig ==${{ zig }}
        - pkgconf
        - llvm-tools

about:
  homepage: https://nlopt.readthedocs.io/
  license: LGPL-2.1-or-later AND MIT
  license_file:
    - COPYING
    - COPYRIGHT
  summary: NLopt (nonlinear optimization), static library for Windows built with zig (private zig-libs sub-prefix)
  repository: https://github.com/stevengj/nlopt
