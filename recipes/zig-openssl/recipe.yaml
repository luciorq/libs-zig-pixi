# zig-openssl: OpenSSL (libssl, libcrypto), static only, for Windows
# (win-64, win-arm64), cross-built on linux with zig-toolchain through
# OpenSSL's own Perl Configure (D1): targets mingw64 / mingwarm64. Installed
# under the private sub-prefix Library/zig-libs/<zig triple>/ (D2):
# lib/{libssl,libcrypto}.a, include/openssl/, lib/pkgconfig/{openssl,
# libssl,libcrypto}.pc (closed, relocatable, Requires: zlib),
# licenses/openssl/.
context:
  # Rtools45 build 6768 (D9), variants.yaml
  version: ${{ openssl_version }}
  zt: ${{ "aarch64-windows-gnu" if target_platform == "win-arm64" else "x86_64-windows-gnu" }}
  sub: Library/zig-libs/${{ zt }}

package:
  name: zig-openssl
  version: ${{ version }}

source:
  - url: https://github.com/openssl/openssl/releases/download/openssl-${{ version }}/openssl-${{ version }}.tar.gz
    sha256: b6a5f44b7eb69e3fa35dbf15524405b44837a481d43d81daddde3ff21fcbb8e9
  # the package test (tests/pkgtest.zig, tests/smoke/openssl.c), for
  # tests.files below; the build does not use it
  - path: ../../tests
    target_directory: zig-libs-tests

build:
  number: 1
  string: zig_${{ hash }}_${{ build_number }}
  script:
    file: build.sh
    env:
      # both zigs (D11): the upstream-zig leg sets ZIG_BIN to PyPI
      # ziglang's zig; empty means the build env's conda-forge zig
      ZIG_BIN: ${{ env.get("ZIG_BIN", default="") }}
      ZIG_TOOLCHAIN_TRACE: ${{ env.get("ZIG_TOOLCHAIN_TRACE", default="") }}
      ZIG_VERSION: ${{ zig }}

requirements:
  build:
    # exact: puts zig_toolchain in the hash (variants.yaml)
    - zig-toolchain ==${{ zig_toolchain }}
    - zig ==${{ zig }}
    # OpenSSL's Configure and its generated Makefile; exact: puts perl
    # and make in the hash (variants.yaml)
    - perl ==${{ perl }}
    - make ==${{ make }}
  host:
    - zig-zlib
  run_exports:
    weak:
      - ${{ pin_subpackage("zig-openssl", upper_bound="x.x") }}

tests:
  - package_contents:
      files:
        exists:
          - ${{ sub }}/lib/libssl.a
          - ${{ sub }}/lib/libcrypto.a
          - ${{ sub }}/include/openssl/ssl.h
          - ${{ sub }}/include/openssl/evp.h
          - ${{ sub }}/include/openssl/opensslconf.h
          - ${{ sub }}/lib/pkgconfig/openssl.pc
          - ${{ sub }}/lib/pkgconfig/libssl.pc
          - ${{ sub }}/lib/pkgconfig/libcrypto.pc
          - ${{ sub }}/licenses/openssl/LICENSE.txt
        # static only (D3): no DLL, no import library, no MSVC-named
        # library; no programs (bin/ is removed), no engines/modules
        not_exists:
          - "**/*.dll"
          - "**/*.dll.a"
          - "**/*.lib"
          - "**/*.exe"
          - ${{ sub }}/bin/**
          - ${{ sub }}/lib/engines-3/**
          - ${{ sub }}/lib/ossl-modules/**
  # tests/pkgtest.zig (its header says what it checks): the relocated .pc
  # files resolve to existing paths (openssl.pc pulls libssl, libcrypto and
  # zig-zlib's zlib through Requires), no absolute prefix in them, no build
  # path in the archives, and tests/smoke/openssl.c links (and runs, on
  # Windows of the same arch). One plain command, so bash (linux) and
  # cmd.exe (Windows) run it alike.
  - script:
      - zig run --global-cache-dir .zig-global-cache --cache-dir .zig-local-cache zig-libs-tests/pkgtest.zig -- ${{ zt }} openssl zig-libs-tests/smoke/openssl.c
    files:
      source:
        - zig-libs-tests/pkgtest.zig
        - zig-libs-tests/smoke/openssl.c
    requirements:
      build:
        - zig ==${{ zig }}
        - pkgconf

about:
  homepage: https://www.openssl.org/
  license: Apache-2.0
  license_file: LICENSE.txt
  summary: OpenSSL (libssl, libcrypto), static libraries for Windows built with zig (private zig-libs sub-prefix)
  repository: https://github.com/openssl/openssl
