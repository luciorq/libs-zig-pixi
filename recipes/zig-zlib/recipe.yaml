# zig-zlib: zlib, static only, for Windows (win-64, win-arm64), cross-built
# on linux with zig-toolchain. Installed under the private sub-prefix
# Library/zig-libs/<zig triple>/ (D2): lib/libz.a, include/{zlib,zconf}.h,
# lib/pkgconfig/zlib.pc (closed, relocatable), licenses/zlib/.
context:
  version: ${{ zlib_version }}
  zt: ${{ "aarch64-windows-gnu" if target_platform == "win-arm64" else "x86_64-windows-gnu" }}
  sub: Library/zig-libs/${{ zt }}

package:
  name: zig-zlib
  version: ${{ version }}

source:
  - url:
      - https://zlib.net/fossils/zlib-${{ version }}.tar.gz
      - https://github.com/madler/zlib/releases/download/v${{ version }}/zlib-${{ version }}.tar.gz
    sha256: 9a93b2b7dfdac77ceba5a558a580e74667dd6fede4585b91eefb60f03b72df23
  # the package test (tests/pkgtest.zig, tests/smoke/zlib.c), for
  # tests.files below; the build does not use it
  - path: ../../tests
    target_directory: zig-libs-tests

build:
  number: 1
  string: zig_${{ hash }}_${{ build_number }}
  script:
    file: build.sh
    env:
      # both zigs (D11): the upstream-zig leg sets ZIG_BIN to PyPI
      # ziglang's zig; empty means the build env's conda-forge zig
      ZIG_BIN: ${{ env.get("ZIG_BIN", default="") }}
      ZIG_TOOLCHAIN_TRACE: ${{ env.get("ZIG_TOOLCHAIN_TRACE", default="") }}
      ZIG_VERSION: ${{ zig }}

requirements:
  build:
    # exact: puts zig_toolchain in the hash (variants.yaml)
    - zig-toolchain ==${{ zig_toolchain }}
    - zig ==${{ zig }}
    # exact: puts cmake and ninja in the hash (variants.yaml)
    - cmake ==${{ cmake }}
    - ninja ==${{ ninja }}
  run_exports:
    weak:
      - ${{ pin_subpackage("zig-zlib", upper_bound="x.x") }}

tests:
  - package_contents:
      files:
        exists:
          - ${{ sub }}/lib/libz.a
          - ${{ sub }}/include/zlib.h
          - ${{ sub }}/include/zconf.h
          - ${{ sub }}/lib/pkgconfig/zlib.pc
          - ${{ sub }}/licenses/zlib/LICENSE
        # static only (D3): no DLL, no import library, no MSVC-named library
        not_exists:
          - "**/*.dll"
          - "**/*.dll.a"
          - "**/*.lib"
  # tests/pkgtest.zig (its header says what it checks): the relocated .pc
  # resolves to existing paths, no absolute prefix in it, no build path in
  # libz.a, and tests/smoke/zlib.c links (and runs, on Windows of the same
  # arch). One plain command, so bash (linux) and cmd.exe (Windows) run it
  # alike; the package_contents test above runs only at build time.
  - script:
      - zig run --global-cache-dir .zig-global-cache --cache-dir .zig-local-cache zig-libs-tests/pkgtest.zig -- ${{ zt }} zlib zig-libs-tests/smoke/zlib.c
    files:
      source:
        - zig-libs-tests/pkgtest.zig
        - zig-libs-tests/smoke/zlib.c
    requirements:
      build:
        - zig ==${{ zig }}
        - pkgconf

about:
  homepage: https://zlib.net/
  license: Zlib
  license_file: LICENSE
  summary: zlib, static library for Windows built with zig (private zig-libs sub-prefix)
  repository: https://github.com/madler/zlib
