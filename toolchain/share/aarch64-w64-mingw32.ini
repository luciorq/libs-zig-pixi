# zig-toolchain: meson cross file for aarch64-w64-mingw32 (zig -target aarch64-windows-gnu).
# First used by zig-libpq (slice2 D119). The wrappers are found on PATH
# (the build env's bin).
[binaries]
c = 'aarch64-w64-mingw32-cc'
cpp = 'aarch64-w64-mingw32-c++'
ar = 'aarch64-w64-mingw32-ar'
ranlib = 'aarch64-w64-mingw32-ranlib'
windres = 'aarch64-w64-mingw32-windres'
strip = 'aarch64-w64-mingw32-strip'
nm = 'aarch64-w64-mingw32-nm'
objdump = 'aarch64-w64-mingw32-objdump'
pkg-config = 'pkgconf'

[properties]
needs_exe_wrapper = true

[host_machine]
system = 'windows'
cpu_family = 'aarch64'
cpu = 'aarch64'
endian = 'little'
