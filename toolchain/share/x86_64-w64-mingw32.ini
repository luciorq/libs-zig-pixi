# zig-toolchain: meson cross file for x86_64-w64-mingw32 (zig -target x86_64-windows-gnu).
# NOT TESTED yet: no recipe uses meson in slice 1. The wrappers are found
# on PATH (the build env's bin).
[binaries]
c = 'x86_64-w64-mingw32-cc'
cpp = 'x86_64-w64-mingw32-c++'
ar = 'x86_64-w64-mingw32-ar'
ranlib = 'x86_64-w64-mingw32-ranlib'
windres = 'x86_64-w64-mingw32-windres'
strip = 'x86_64-w64-mingw32-strip'
nm = 'x86_64-w64-mingw32-nm'
objdump = 'x86_64-w64-mingw32-objdump'
pkg-config = 'pkgconf'

[properties]
needs_exe_wrapper = true

[host_machine]
system = 'windows'
cpu_family = 'x86_64'
cpu = 'x86_64'
endian = 'little'
