# Global pins for every recipe (rattler-build -m variants.yaml).
#
# zig: exact. A zig bump rebuilds every package and bumps every build
# number (D4); the published packages are built with conda-forge's zig
# (D11), the upstream-zig leg points ZIG_BIN at PyPI ziglang of the same
# version.
zig:
  - "0.17.1"

# zig-toolchain: exact, and every recipe requires
# `zig-toolchain ==${{ zig_toolchain }}`, so the key is in every build
# string's hash. Any change to toolchain/ (wrapper flags, activation
# script, CMake/meson files) bumps this version (and toolchain/src/main.zig
# `version`), which rebuilds every package; an unchanged hash would let
# --skip-existing keep packages built by the old toolchain. The rule holds
# from the first publish (M5) on; before that, a toolchain/ change that
# leaves the wrapper flags, activation script and CMake/meson files as they
# were keeps the version (PLAN.md D37).
zig_toolchain:
  - "0.2.0"

# Build tools from conda-forge that shape a package's files: exact, and
# each recipe that runs one requires `<tool> ==${{ <key> }}`, so the key is
# in that recipe's hash. Unpinned, a new tool version could change a
# package (CMake/Ninja: generated build, flags, install layout; perl and
# make: OpenSSL's Configure and Makefile; sqlite: the sqlite3 shell that
# writes zig-proj's proj.db) under an unchanged build string, and
# --skip-existing would keep the old one (DESIGN R15, slice1 PLAN S1-F18).
# A bump here rebuilds the recipes that use the key and bumps their build
# numbers (as D4 does for zig). The versions are the ones the build that
# preceded the first publish resolved (CI run 44984149674, all four cross
# legs). The test-only tools (pkgconf, llvm-tools in tests.requirements)
# stay unpinned: they do not touch the package's files, and a new version
# shows up as a test result, not a stale package.
cmake:
  - "4.5.1"
ninja:
  - "1.13.2"
perl:
  - "5.44.0"
make:
  - "4.4.1"
sqlite:
  - "3.54.1"
# autotools recipes through `zig-toolchain configure` (slice2 D104): m4
# (gmp's configure needs it even with --disable-assembly) and llvm-tools
# (llvm-nm as NM: gmp's x86 configure reads its assembler probes with nm).
# Versions as resolved 2026-11-23 (slice2 PLAN.md S2-F3).
m4:
  - "1.4.21"
llvm_tools:
  - "23.1.6"
# meson recipes (zig-libpq, slice2 D119): meson, and the parser and header
# generators PostgreSQL's git tag needs. Versions as resolved 2026-11-24
# (slice2 PLAN.md S2-F27).
meson:
  - "1.12.1"
bison:
  - "3.8.2"
flex:
  - "2.6.4"

# Upstream versions: Rtools45 build 6768 (D9). Each recipe reads its own
# key (zlib_version, ...) in its context, so the version is only here; the
# key is then in that recipe's hash. The sha256 stays in the recipe, and
# so does sqlite's release year in its URL (sqlite.org/<year>/...).
zlib_version:
